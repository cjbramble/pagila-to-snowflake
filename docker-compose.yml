services:
  source-db:
    # Pagila master needs PostgreSQL 18 and pgvector; this image bundles both.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: pagila-source
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
    ports:
      # Localhost only, on a non-default port so it doesn't clash with other local Postgres.
      - "127.0.0.1:${PGPORT:-5434}:5432"
    volumes:
      # Init scripts run once, in name order, only when the volume is empty.
      - ./docker/pagila/pagila-schema.sql:/docker-entrypoint-initdb.d/01-pagila-schema.sql:ro
      - ./docker/pagila/pagila-data.sql:/docker-entrypoint-initdb.d/02-pagila-data.sql:ro
      # PG 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
