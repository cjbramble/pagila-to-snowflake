# Human decisions recorded with the migration sign-off. Read by `python -m reconcile.signoff`.
#
# dispositions: one per known source issue (SRC-* in requirements.yml).
#   status          pending | accepted (migrate as-is) | fix_before_go_live
#   recommendation  Claude's proposal; the human decides and fills decided_by
# waivers: a failing requirement that may go live anyway. Empty means none.
#   requirement, reason, approved_by, expires (YYYY-MM-DD)
#
# Dispositions are shown in the report but don't affect the verdict, which depends only on
# test results. An approved, unexpired waiver counts a failing requirement as passing.

dispositions:
  SRC-001:
    status: accepted
    recommendation: accepted. The 14,665 early payments are how Pagila's data was
      generated; they migrate unchanged (MIG-005), and ETL-003 counts them normally.
    decided_by: Chet
  SRC-002:
    status: accepted
    recommendation: accepted. Zero-amount payments are real rows; ETL-002 counts them.
    decided_by: Chet
  SRC-003:
    status: accepted
    recommendation: accepted for this demo (D09). On a real program, a data owner signs off
      on migrating credential hashes, or the column is excluded.
    decided_by: Chet
  SRC-004:
    status: accepted
    recommendation: accepted. No declared FK and no orphans; the marts don't use store
      managers.
    decided_by: Chet
  SRC-005:
    status: accepted
    recommendation: accepted. 5 payments, 9.95 total; lifetime value credits the payer,
      which is what the payment row records.
    decided_by: Chet

waivers: []
