[project]
name = "pagila-to-snowflake"
version = "0.1.0"
description = "Pagila Postgres to Snowflake migration with reconciliation and ETL testing"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3",
    "snowflake-connector-python>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
