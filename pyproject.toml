[project]
name = "pagila-to-snowflake"
version = "0.1.0"
description = "Pagila Postgres to Snowflake migration with reconciliation and ETL testing"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3",
    "pyarrow>=26.0",
    "pyyaml>=6.0",
    "snowflake-connector-python>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "soda-postgres>=4.28",
    "soda-snowflake>=4.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate", "src/reconcile"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "source_db: needs the source Postgres (PG* env vars)",
    "target_db: needs Snowflake (connection from ~/.snowflake/connections.toml)",
]
filterwarnings = [
    # Both raised inside Soda Core: its own Snowflake connection doesn't set the new
    # connector option (migrate.snowflake_conn does), and an internal SQL AST class.
    "ignore:enable_server_session_keep_alive_auto_detection:FutureWarning",
    "ignore::DeprecationWarning:soda_core.common.sql_ast",
]
